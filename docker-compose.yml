services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: teamtasks-passwd
      POSTGRES_DB: teamtasks_db
    ports:
      - "5432:5432"
  cache:
    image: redis:alpine
    ports:
      - "6379:6379"

  queue:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # App logic
      - "15672:15672" # Rabbit UI

  logs:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: teamtasks-passwd
    ports:
      - "8081:80"     # UI
      - "5341:5341"   # API Log Ingestion

  api:
    build:
      context: .
      dockerfile: TeamTasks.Api/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=teamtasks_db;Username=admin;Password=teamtasks-passwd
      - ConnectionStrings__Redis=cache:6379
      - ConnectionStrings__RabbitMQ=queue
      - ConnectionStrings__Seq=logs:5341
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Jwt__SecretKey=${JWT_SECRET}
    ports:
      - "5000:8080"
      - "5001:8081"
    depends_on:
      - db
      - cache

  worker:
    build:
      context: .
      dockerfile: TeamTasks.Worker/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__RabbitMQ=queue
      - Jwt__SecretKey=${JWT_SECRET}
      - ConnectionStrings__Seq=logs:5341
    depends_on:
      - queue